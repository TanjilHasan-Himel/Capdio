<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenCapture Spike</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 380px;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #38bdf8;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    pre {
      background: #1e293b;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      max-height: 250px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .badge-info {
      background: #0369a1;
      color: #e0f2fe;
    }
  </style>
</head>
<body>
  <h2>OpenCapture Studio — Spike (OCS-002)</h2>
  <div class="badge badge-info" id="statusBadge">Ready</div>
  <div>
    <button id="btnProbe">Probe Capabilities</button>
    <button id="btnCapture">Test Capture (3s)</button>
  </div>
  <pre id="output">Click a button to start API test...</pre>
  <script type="module" src="popup.js"></script>
</body>
</html>
