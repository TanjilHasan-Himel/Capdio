<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenCapture Spike Target Fixture</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 8px 0;
      color: #38bdf8;
      font-size: 24px;
    }
    p {
      color: #94a3b8;
      margin: 0 0 16px 0;
    }
    #canvas {
      border: 2px solid #334155;
      border-radius: 8px;
      background: #020617;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s;
    }
    button:hover {
      background: #0369a1;
    }
    .audio-indicator {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ef4444;
      margin-left: 8px;
    }
    .audio-indicator.active {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }
  </style>
</head>
<body>
  <h1>OpenCapture Studio — Test Fixture Tab</h1>
  <p>Target tab generating dynamic canvas animation and synthesized continuous audio.</p>

  <canvas id="canvas" width="1280" height="720"></canvas>

  <div class="controls">
    <button id="btnAudio">Start Continuous Test Audio</button>
    <div style="display:flex; align-items:center;">
      <span>Audio:</span>
      <span id="audioDot" class="audio-indicator"></span>
      <span id="audioLabel" style="margin-left:6px; font-size:12px; color:#94a3b8;">Silent</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let frame = 0;

    function render() {
      frame++;
      const time = performance.now() / 1000;

      // Dark gradient background
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Rotating complex star
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(time * 1.5);
      for (let i = 0; i < 8; i++) {
        ctx.rotate((Math.PI * 2) / 8);
        ctx.fillStyle = `hsl(${(frame * 2 + i * 45) % 360}, 80%, 60%)`;
        ctx.fillRect(60, -15, 120, 30);
      }
      ctx.restore();

      // Info overlay
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px monospace';
      ctx.fillText(`OPENCAPTURE SPIKE TARGET`, 40, 60);

      ctx.font = '24px monospace';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`Frame: ${frame} | Timestamp: ${time.toFixed(3)}s`, 40, 100);

      ctx.fillStyle = '#a855f7';
      ctx.fillText(`Resolution Target: 1080p | Canvas: ${canvas.width}x${canvas.height}`, 40, 140);

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // Audio synthesizer
    let audioCtx = null;
    let osc = null;
    let isPlaying = false;
    const btnAudio = document.getElementById('btnAudio');
    const audioDot = document.getElementById('audioDot');
    const audioLabel = document.getElementById('audioLabel');

    window.startTestAudio = function() {
      if (isPlaying) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      // LFO modulation for clear sound variation
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 2; // 2Hz wobble
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 100;
      lfo.connect(osc.frequency);
      lfo.start();

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime); // Comfortable volume

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();

      isPlaying = true;
      audioDot.classList.add('active');
      audioLabel.textContent = 'Playing 440Hz modulated';
      btnAudio.textContent = 'Stop Test Audio';
    };

    window.stopTestAudio = function() {
      if (!isPlaying) return;
      if (osc) {
        osc.stop();
        osc.disconnect();
      }
      if (audioCtx) {
        audioCtx.close();
      }
      isPlaying = false;
      audioDot.classList.remove('active');
      audioLabel.textContent = 'Silent';
      btnAudio.textContent = 'Start Continuous Test Audio';
    };

    btnAudio.addEventListener('click', () => {
      if (isPlaying) {
        window.stopTestAudio();
      } else {
        window.startTestAudio();
      }
    });

    // Auto-start audio if requested via query parameter
    if (new URLSearchParams(window.location.search).get('autoplayAudio') === '1') {
      window.startTestAudio();
    }
  </script>
</body>
</html>
