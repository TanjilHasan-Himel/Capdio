<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capdio — Screen Recorder</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 10px;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-badge.recording {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .status-badge.paused {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .control-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 500;
    }

    select, button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 12px;
    }

    .toggle-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .primary-btn {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      padding: 10px;
      transition: background 0.15s ease;
    }

    .primary-btn:hover {
      background: var(--accent-hover);
    }

    .danger-btn {
      background: var(--danger);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 10px;
    }

    .danger-btn:hover {
      background: var(--danger-hover);
    }

    .warning-btn {
      background: var(--warning);
      color: black;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 10px;
    }

    .hidden {
      display: none !important;
    }

    footer {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Capdio</h1>
      <p>Capture everything. Miss nothing.</p>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <main>
    <div id="configSection">
      <div class="control-group">
        <label for="captureTarget">Source</label>
        <select id="captureTarget">
          <option value="tab" selected>Current Tab</option>
          <option value="screen">Entire Screen</option>
          <option value="window">Application Window</option>
        </select>
      </div>

      <div class="control-group">
        <label for="qualityPreset">Quality Preset</label>
        <select id="qualityPreset">
          <option value="1080p" selected>1080p Full HD (30 FPS)</option>
          <option value="720p">720p HD (30 FPS)</option>
          <option value="4k">4K Ultra HD (60 FPS)</option>
        </select>
      </div>

      <div class="control-group">
        <div class="toggle-row">
          <span>Tab Audio Monitor</span>
          <input type="checkbox" id="tabAudioToggle" checked>
        </div>
        <div class="toggle-row">
          <span>Microphone</span>
          <input type="checkbox" id="micToggle">
        </div>
      </div>

      <button id="recordButton" class="primary-btn">Start Recording</button>
    </div>

    <div id="activeSection" class="hidden">
      <div class="control-group">
        <label>Active Session</label>
        <div id="activeSessionInfo" style="font-size: 11px; color: var(--text-muted); word-break: break-all;">-</div>
      </div>
      <div class="btn-row">
        <button id="pauseResumeButton" class="warning-btn">Pause</button>
        <button id="stopButton" class="danger-btn">Stop</button>
      </div>
    </div>

    <div id="readySection" class="hidden">
      <div class="control-group" style="text-align: center; padding: 12px 0;">
        <span style="font-size: 14px; color: var(--success); font-weight: 600;">Recording Complete!</span>
      </div>
      <button id="resetButton" class="primary-btn">New Recording</button>
    </div>
  </main>

  <footer>
    <span>v0.1.0 (Core)</span>
    <span>100% Local & Private</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
